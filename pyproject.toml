[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocv"
version = "0.1.1"
description = "Chain of Custody Verification: cross-layer verification for consumer privacy and security software"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yevheniia Sakovets" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cocv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
